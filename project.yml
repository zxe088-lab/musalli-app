name: Almuadhin
options:
  bundleIdPrefix: com.zxe088
  developmentLanguage: ar
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # ضع معرّف فريق Apple Developer هنا (أو اختره من Xcode → Signing & Capabilities)
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Almuadhin:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: المؤذّن
        CFBundleDevelopmentRegion: ar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocationWhenInUseUsageDescription: نستخدم موقعك لحساب مواقيت الصلاة واتجاه القبلة بدقة.
    entitlements:
      path: App/Almuadhin.entitlements
      properties:
        com.apple.security.application-groups: [group.com.zxe088.almuadhin]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zxe088.almuadhin
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: AlmuadhinWidget
  AlmuadhinWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: المؤذّن
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/AlmuadhinWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.zxe088.almuadhin]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zxe088.almuadhin.widget
schemes:
  Almuadhin:
    build:
      targets:
        Almuadhin: all
        AlmuadhinWidget: all
    run:
      config: Debug
    archive:
      config: Release
