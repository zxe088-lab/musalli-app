name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Prayer-time checks
        run: |
          swiftc Shared/PrayerTimes.swift Tests/main.swift -o "$RUNNER_TEMP/check"
          "$RUNNER_TEMP/check"

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build for simulator (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project Almuadhin.xcodeproj -scheme Almuadhin \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -n 80
